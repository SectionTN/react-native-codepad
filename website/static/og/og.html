<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>react-native-codepad social card</title>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../fonts/JetBrainsMono-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-top: 6px solid #79c0ff;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 28px;
        color: #8b949e;
      }
      .name svg {
        width: 36px;
        height: 36px;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.03em;
        max-width: 960px;
      }
      p {
        margin: 0;
        font-size: 30px;
        line-height: 1.35;
        color: #8b949e;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="name">
        <svg viewBox="0 0 24 24" fill="none" stroke="#79c0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><title>react-native-codepad</title><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M12 4v16"/></svg>
        react-native-codepad
      </div>
      <h1>A native code editor for React Native.</h1>
      <p>Kotlin and Swift engines, tree-sitter highlighting, a Nitro binding and no WebView.</p>
    </div>
  </body>
</html>
