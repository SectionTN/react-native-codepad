name: Docs on Cloudflare
on:
  push:
    branches:
      - main
    paths:
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the site for the domain
        run: yarn docs:build
        env:
          DOCS_URL: https://reactnativecodepad.dev
          DOCS_BASE_URL: /

      # Skipped until the two secrets exist; the build above still checks the site.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: npx --yes wrangler@4.151.0 deploy
