name: Publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the tag against package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # Staged publishing needs npm 11.15 or newer; Node 24.13 ships 11.6.
      - name: Update npm
        run: npm install -g npm@11.19.1

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Build package
        run: yarn prepare

      # Each package lands in the staging area; the versions go live once approved on npmjs.com, the core first.
      - name: Stage the core, then the language packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          fi
          stage() {
            name=$(node -p "require('./$1/package.json').name")
            version=$(node -p "require('./$1/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm, skipping"
              return
            fi
            if (cd "$1" && npm stage publish --provenance --access public --ignore-scripts); then
              return
            fi
            if npm stage list "$name" 2>/dev/null | grep -q "$version"; then
              echo "$name@$version is already staged, skipping"
              return
            fi
            return 1
          }
          stage .
          for pkg in languages/*/package.json; do
            stage "$(dirname "$pkg")"
          done
