name: Bug report
description: A reproducible problem in react-native-codepad.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happens, what you expected, and any log line or screenshot that helps.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      placeholder: "0.1.0, or the commit when built from the repository"
    validations:
      required: true
  - type: input
    id: react-native-version
    attributes:
      label: React Native version
      placeholder: "0.87.1, and the Expo SDK version if you use Expo"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 9a, Android 16"
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard app and version
      description: The active keyboard app and its version from its app info page. Keyboards differ, so this decides where the bug is.
      placeholder: "Gboard 15.9"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language package
      description: The language prop and the package version, when highlighting is involved.
      placeholder: "react-native-codepad-lang-javascript 0.1.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to type or tap, in order, from a fresh screen.
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Snippet
      description: The props and calls the editor gets, or a link to a repository that reproduces it.
      render: tsx
