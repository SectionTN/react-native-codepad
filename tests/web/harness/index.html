<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>codepad web harness</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      .box { width: 600px; height: 300px; }
    </style>
  </head>
  <body>
    <div id="a" class="box"></div>
    <div id="b" class="box"></div>
    <div id="c"></div>
    <script type="module">
      import { configureWeb } from '/lib/module/web/configure.js';
      import { EditorView } from '/lib/module/web/EditorView.js';
      import { ensureLanguage, loadCore } from '/lib/module/web/loader.js';

      configureWeb({ assetsUrl: new URL(location.href).searchParams.get('assets') });
      // Waits a frame at a time until test() holds, or fails after two seconds.
      async function until(test) {
        const end = performance.now() + 2000;
        while (!test()) {
          if (performance.now() > end) throw new Error('timed out');
          await new Promise((r) => requestAnimationFrame(r));
        }
      }
      // Waits n frames.
      async function frames(n) {
        for (let i = 0; i < n; i++) await new Promise((r) => requestAnimationFrame(r));
      }
      window.codepad = { EditorView, ensureLanguage, frames, loadCore, until };
      window.ready = true;
    </script>
  </body>
</html>
