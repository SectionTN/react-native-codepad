<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyboard recorder</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 12px; }
      textarea { width: 100%; font: 16px ui-monospace, Menlo, monospace; white-space: pre; resize: none; }
      pre { font: 12px ui-monospace, Menlo, monospace; background: #f4f4f4; padding: 8px; overflow: auto; max-height: 40vh; }
      input { font-size: 16px; width: 100%; margin: 4px 0; }
      button { font-size: 16px; padding: 8px 14px; margin: 4px 4px 4px 0; }
    </style>
  </head>
  <body>
    <textarea id="ta" rows="3"></textarea>
    <div id="status"></div>
    <input id="name" placeholder="name, like gboard-autocorrect" />
    <input id="browser" placeholder="browser, like chrome-android" />
    <input id="keyboard" placeholder="keyboard, like Gboard with autocorrect on" />
    <button id="save" type="button">Save</button><button id="reset" type="button">Reset</button>
    <pre id="doc"></pre>
    <script type="module" src="recorder.js"></script>
  </body>
</html>
